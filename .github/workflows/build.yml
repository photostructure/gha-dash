name: Build & Prepare Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  build:
    name: Test Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24, 26]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Verify old npm is rejected for dependency resolution
        env:
          npm_config_user_agent: npm/11.9.9 node/v24.19.0 linux x64
        run: |
          if node scripts/check-npm-version.mjs; then
            echo "::error::The dependency-resolution npm floor was not enforced"
            exit 1
          fi

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke-test the packed CLI
        run: |
          ARTIFACT_DIR=".package-artifact"
          SMOKE_DIR=".package-smoke"
          if [[ -e "$ARTIFACT_DIR" || -e "$SMOKE_DIR" ]]; then
            echo "::error::Refusing to replace an existing package smoke-test directory"
            exit 1
          fi
          mkdir "$ARTIFACT_DIR" "$SMOKE_DIR"
          trap 'rm -rf "$ARTIFACT_DIR" "$SMOKE_DIR"' EXIT

          npm pack \
            --json \
            --ignore-scripts \
            --pack-destination "$ARTIFACT_DIR" \
            > "$ARTIFACT_DIR/PACK.json"

          TARBALL_FILENAME="$(
            node -e '
              const fs = require("node:fs")
              const packed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
              if (packed.length !== 1) throw new Error("expected one tarball")
              process.stdout.write(packed[0].filename)
            ' "$ARTIFACT_DIR/PACK.json"
          )"
          TARBALL="$ARTIFACT_DIR/$TARBALL_FILENAME"

          tar -xzf "$TARBALL" -C "$SMOKE_DIR"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          ACTUAL_VERSION="$(node "$SMOKE_DIR/package/dist/cli.js" --version)"
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Packed CLI reported $ACTUAL_VERSION, expected $EXPECTED_VERSION"
            exit 1
          fi

      - name: Verify the tested source stayed unchanged
        run: git diff --exit-code

  release:
    name: Create signed release commit and tag
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    concurrency:
      group: ${{ github.repository }}-release
      # GitHub's default permits one pending run. actionlint 1.7.12 predates
      # the equivalent explicit "queue: single" syntax.
      cancel-in-progress: false
    permissions:
      contents: write # Push the signed release commit and annotated tag.

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The isolated release job must push. It installs no dependencies and
          # has neither npm credentials nor OIDC publishing authority.
          persist-credentials: true

      - name: Verify the release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be dispatched from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ]]; then
            echo "::error::$DEFAULT_BRANCH moved after this release run started; run it again"
            exit 1
          fi

      - name: Install the release Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify the release toolchain
        run: |
          [[ "$(node --version)" == "v24.19.0" ]]
          [[ "$(npm --version)" == "11.17.0" ]]

      - name: Set up SSH signing
        uses: photostructure/git-ssh-signing-action@abd2a642ab7d704f66193472b47c72375d85a0c1 # v2.0.1
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-user-email: ${{ secrets.GIT_USER_EMAIL }}

      - name: Bump the package version
        id: version
        env:
          BUMP: ${{ inputs.version }}
        run: |
          case "$BUMP" in
            patch|minor|major) ;;
            *)
              echo "::error::Unsupported version bump: $BUMP"
              exit 1
              ;;
          esac

          npm version "$BUMP" --no-git-tag-version --ignore-scripts

          if ! git diff --quiet -- . \
            ':(exclude)package.json' \
            ':(exclude)package-lock.json'; then
            echo "::error::The version bump changed unexpected files"
            git diff --name-only
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const pkg = require("./package.json")
            const lock = require("./package-lock.json")
            if (lock.version !== pkg.version || lock.packages[""].version !== pkg.version) {
              throw new Error("package.json and package-lock.json versions do not match")
            }
          '

          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists locally"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists on origin"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and verify the signed release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): $VERSION"
          git tag -m "Release $VERSION" "$TAG"
          git verify-commit HEAD
          git verify-tag "$TAG"

      - name: Push the commit and tag atomically
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "HEAD:$DEFAULT_BRANCH" "refs/tags/$TAG"

  dispatch:
    name: Start tag-bound npm staging
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      actions: write # Dispatch publish.yaml at the newly created tag.

    steps:
      # GITHUB_TOKEN-created tag events do not start another workflow. Keeping
      # dispatch separate makes an API failure rerunnable without another bump.
      - name: Start the tag-bound publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run publish.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
