name: Publish GitHub Release
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.repository }}-${{ github.ref }}
  # GitHub's default permits one pending run. actionlint 1.7.12 predates
  # the equivalent explicit "queue: single" syntax.
  cancel-in-progress: false

jobs:
  release:
    name: Publish approved immutable release
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the successful tag-bound staging artifact.
      contents: write # Create and publish the GitHub release.
    env:
      EXPECTED_PACKAGE: gha-dash
      TAG: ${{ github.ref_name }}

    steps:
      - name: Verify the approved package and signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::This workflow must run at a release tag, not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG is not a stable vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          EXPECTED_VERSION="${TAG#v}"

          TAG_OBJECT_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha'
          )"
          TAG_OBJECT_TYPE="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type'
          )"
          TAG_TARGET_TYPE="$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.object.type'
          )"
          TAG_TARGET_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.object.sha'
          )"
          TAG_VERIFIED="$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.verification.verified'
          )"
          COMMIT_VERIFIED="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_TARGET_SHA" --jq '.commit.verification.verified'
          )"

          if [[ "$TAG_OBJECT_TYPE" != tag || "$TAG_TARGET_TYPE" != commit || "$TAG_TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG must be annotated and point directly to the workflow commit"
            exit 1
          fi
          if [[ "$TAG_VERIFIED" != true || "$COMMIT_VERIFIED" != true ]]; then
            echo "::error::The release commit and annotated tag must both have verified signatures"
            exit 1
          fi

          REGISTRY_JSON="$(
            curl --fail --silent --show-error \
              "https://registry.npmjs.org/$EXPECTED_PACKAGE/$EXPECTED_VERSION"
          )"
          if [[ "$(printf '%s' "$REGISTRY_JSON" | jq -r '.version')" != "$EXPECTED_VERSION" ]]; then
            echo "::error::$EXPECTED_PACKAGE@$EXPECTED_VERSION is not public on npm"
            exit 1
          fi

          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_TAG_SHA=$TAG_TARGET_SHA" >> "$GITHUB_ENV"

      - name: Download the successful staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS_JSON="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yaml/runs?event=workflow_dispatch&status=success&head_sha=$EXPECTED_TAG_SHA&per_page=100"
          )"
          mapfile -t RUN_IDS < <(
            printf '%s' "$RUNS_JSON" |
              jq -r \
                --arg sha "$EXPECTED_TAG_SHA" \
                --arg tag "$TAG" \
                '.workflow_runs[] |
                 select(.head_sha == $sha and .head_branch == $tag) |
                 .id'
          )
          if [[ "${#RUN_IDS[@]}" -ne 1 ]]; then
            echo "::error::Expected one successful staging run for $TAG, found ${#RUN_IDS[@]}"
            exit 1
          fi

          mkdir package-artifact
          gh run download "${RUN_IDS[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "npm-package-$TAG" \
            --dir package-artifact

      - name: Match the artifact to the public npm package
        run: |
          mapfile -t ARTIFACT_FILES < <(
            find package-artifact -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${#ARTIFACT_FILES[@]}" -ne 4 ]]; then
            echo "::error::Expected four package artifact files, found ${#ARTIFACT_FILES[@]}"
            printf '%s\n' "${ARTIFACT_FILES[@]}"
            exit 1
          fi

          (
            cd package-artifact
            sha256sum --check SHA256SUMS
          )

          mapfile -t TARBALLS < <(
            find package-artifact -maxdepth 1 -type f -name '*.tgz' | LC_ALL=C sort
          )
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"

          jq -e '
            length == 1 and
            .[0].name == env.EXPECTED_PACKAGE and
            .[0].version == env.EXPECTED_VERSION
          ' package-artifact/PACK.json
          if [[ "$(basename "$TARBALL")" != "$(jq -r '.[0].filename' package-artifact/PACK.json)" ]]; then
            echo "::error::Pack metadata does not name the downloaded tarball"
            exit 1
          fi

          EMBEDDED_NAME="$(tar -xOf "$TARBALL" package/package.json | jq -r '.name')"
          EMBEDDED_VERSION="$(tar -xOf "$TARBALL" package/package.json | jq -r '.version')"
          if [[ "$EMBEDDED_NAME" != "$EXPECTED_PACKAGE" || "$EMBEDDED_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Downloaded package identity does not match $TAG"
            exit 1
          fi

          tar -tzf "$TARBALL" | LC_ALL=C sort > "$RUNNER_TEMP/CONTENTS.txt"
          cmp package-artifact/CONTENTS.txt "$RUNNER_TEMP/CONTENTS.txt"

          REGISTRY_JSON="$(
            curl --fail --silent --show-error \
              "https://registry.npmjs.org/$EXPECTED_PACKAGE/$EXPECTED_VERSION"
          )"
          REGISTRY_INTEGRITY="$(printf '%s' "$REGISTRY_JSON" | jq -r '.dist.integrity')"
          ARTIFACT_INTEGRITY="sha512-$(
            openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A
          )"
          if [[ "$ARTIFACT_INTEGRITY" != "$REGISTRY_INTEGRITY" ]]; then
            echo "::error::The approved npm tarball differs from the staging artifact"
            exit 1
          fi

          NPM_GIT_HEAD="$(printf '%s' "$REGISTRY_JSON" | jq -r '.gitHead // empty')"
          if [[ -n "$NPM_GIT_HEAD" && "$NPM_GIT_HEAD" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::npm gitHead $NPM_GIT_HEAD does not match $EXPECTED_TAG_SHA"
            exit 1
          fi

      - name: Create and publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_OBJECT_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha'
          )"
          TAG_TARGET_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.object.sha'
          )"
          TAG_VERIFIED="$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.verification.verified'
          )"
          COMMIT_VERIFIED="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_TARGET_SHA" --jq '.commit.verification.verified'
          )"
          if [[ "$EXPECTED_TAG_SHA" != "$GITHUB_SHA" || "$TAG_TARGET_SHA" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::Tag $TAG moved after artifact verification"
            exit 1
          fi
          if [[ "$TAG_VERIFIED" != true || "$COMMIT_VERIFIED" != true ]]; then
            echo "::error::Tag $TAG or its commit lost verified-signature status"
            exit 1
          fi
          # Assets must be attached before publishing, because publishing is
          # what freezes an immutable release. A run interrupted between the
          # two calls below leaves a draft, which is unpublished and has no
          # consumers, so discarding it keeps this workflow rerunnable.
          EXISTING_RELEASE="$(
            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,author \
              --jq '"\(.isDraft) \(.author.login)"' 2>/dev/null || true
          )"
          case "$EXISTING_RELEASE" in
            "") ;;
            "true github-actions[bot]")
              # This workflow authored it, so deleting it only undoes our own
              # interrupted run. Never pass --cleanup-tag: the signed tag must
              # survive.
              echo "::notice::Discarding the incomplete draft release $TAG"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
              ;;
            "true "*)
              echo "::error::Draft release $TAG was authored by ${EXISTING_RELEASE#true }, not this workflow; resolve it by hand"
              exit 1
              ;;
            *)
              echo "::error::GitHub release $TAG is already published"
              exit 1
              ;;
          esac

          gh release create "$TAG" \
            package-artifact/*.tgz \
            package-artifact/PACK.json \
            package-artifact/CONTENTS.txt \
            package-artifact/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --draft
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          if [[ "$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable'
          )" != true ]]; then
            echo "::error::GitHub release $TAG was not made immutable"
            exit 1
          fi
